  .contact { color: #444; font-size: 15px; font-weight: 700; line-height: 1.9; margin-bottom: 10px; }

  .contact a:hover { color: #d35400; }
  .linkedin { display: flex; align-items: center; justify-content: center; gap: 8px; color: #0a66c2; font-size: 15px; font-weight: 700; text-decoration: none; margin-bottom: 25px; }
